<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Projekt · Din Konsult i Väst AB</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Serif:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
  main { padding-block: 64px 96px; min-height: 70vh; }
  .ruta { background: var(--papper); border: 1px solid var(--linje); padding: 40px; max-width: 440px; }
  .ruta h1, .lista-topp h1 { font-family: var(--serif); font-weight: 500; font-size: 32px; line-height: 1.2; color: var(--marin); margin: 0 0 12px; }
  .ruta p { color: var(--text-dov); margin: 0 0 28px; font-size: 16px; }
  label.falt { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dov); margin-bottom: 8px; }
  input[type=password] { width: 100%; font: inherit; padding: 12px 14px; border: 1px solid var(--linje); background: var(--grund); color: var(--text); }
  input[type=password]:focus { outline: 2px solid var(--vatten); outline-offset: 0; border-color: var(--vatten); }
  .rad { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 20px; flex-wrap: wrap; }
  .kom { display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--text-dov); }
  button.knapp { font: inherit; font-size: 15px; background: var(--marin); color: #F2F5F8; border: 0; padding: 12px 22px; cursor: pointer; }
  button.knapp:hover { background: var(--marin-djup); }
  button.knapp[disabled] { opacity: .6; cursor: wait; }
  .fel { color: #9B2C2C; font-size: 15px; margin: 12px 0 -12px; min-height: 1.4em; }
  .lista-topp { display: flex; align-items: end; justify-content: space-between; gap: 24px; flex-wrap: wrap; margin-bottom: 32px; }
  .lista-topp p { margin: 0; color: var(--text-dov); }
  button.lank { font: inherit; font-size: 15px; background: none; border: 0; color: var(--vatten); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; padding: 0; }
  .projekt { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .projekt a { display: block; height: 100%; background: var(--papper); border: 1px solid var(--linje); padding: 24px; text-decoration: none; color: var(--text); transition: border-color .15s; }
  .projekt a:hover { border-color: var(--vatten); }
  .projekt .meta { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--sand); display: flex; justify-content: space-between; gap: 12px; }
  .projekt h2 { font-family: var(--serif); font-weight: 500; font-size: 22px; color: var(--marin); margin: 10px 0 8px; }
  .projekt p { margin: 0; font-size: 15px; color: var(--text-dov); line-height: 1.55; }
  [hidden] { display: none !important; }
</style>
<script src="/projekt/las.js"></script>
</head>
<body>

<header class="topp">
  <div class="wrap">
    <a class="marke" href="/" aria-label="Din Konsult i Väst AB, startsida">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <rect x="0" y="0" width="40" height="40" fill="#14304A"/>
        <rect x="6" y="13" width="28" height="4" fill="#F2F5F8"/>
        <rect x="10" y="17" width="3" height="11" fill="#F2F5F8"/>
        <rect x="18.5" y="17" width="3" height="11" fill="#F2F5F8"/>
        <rect x="27" y="17" width="3" height="11" fill="#F2F5F8"/>
        <path d="M6 31c3 0 3-2 6-2s3 2 6 2 3-2 6-2 3 2 6 2 3-2 4-2" fill="none" stroke="#4A7A9B" stroke-width="2"/>
      </svg>
      <span><b>Din Konsult i Väst</b><small>Beställarstöd i anläggning</small></span>
    </a>
  </div>
</header>

<main>
  <div class="wrap">

    <form class="ruta" id="inlogg" hidden>
      <h1>Projekt</h1>
      <p>Arbetsmaterial och prototyper. Ange lösenordet för att fortsätta.</p>
      <label class="falt" for="losen">Lösenord</label>
      <input type="password" id="losen" autocomplete="current-password" required autofocus>
      <div class="rad">
        <label class="kom"><input type="checkbox" id="kom"> Kom ihåg den här enheten</label>
        <button class="knapp" id="knapp" type="submit">Logga in</button>
      </div>
      <p class="fel" id="fel" role="alert"></p>
    </form>

    <div id="vy" hidden>
      <div class="lista-topp">
        <div>
          <h1>Projekt</h1>
          <p id="antal"></p>
        </div>
        <button class="lank" id="ut" type="button">Logga ut</button>
      </div>
      <ul class="projekt" id="lista"></ul>
    </div>

  </div>
</main>

<script>
(function () {
  var LISTA = "bSjVdxCUJ58tsNHVJ4QR31AXPZ5mI6RyQhPmzCo5oG83opb/MMSaZHstulJupT60DGG08FkgLJHm2DqjAeV5Bz/w0frTxrOMdaikWppjAqkQvpauFsvPCCMDT5VBerxDw58jiV7W9YN2N9EMki+9KgbZUt1LAB34sa188g7E9wVCVGpR3yeWS0WgCqh5DFpYcGvrJeGRK67DJSTagqzOyse7U/2QhpoJW6qy9FTXY+gAzeNnzPLL34gzeT53EUKdbYNxG4KgU3lmk6pq3uVaces53Qh6Q4P8Z7E9FrjLws+ibqArBYrTScjz9AXpMu/xqVu/6ri7YxsS7T3wG8QORFeJufR/X/E8H5RjB0T9aNF5TFP7+vYgFZsVqudZWbrsKXOeiTaoeAZUUi382Bw7XF2nu/wwKuF3cn04CBUhJh06XkjvJeipHv/5N6N4KC++ednSWUh3iqlWaVHGCq/NcPCN5fcxAxVKN8P7fUdIaFuxQs1w79whi6PZeom+QxtgK5MiXkUtzGXOlCnSAMm6mCRe647Kn2hM/i0ucL9Ybevv849qNhNecvU5NIrT20EDFZCY430X4Q/iFBnRgmGkX/Y0lAdwQKjtllFtg2hUqFF9Ym5uTynXxCT+IXeumqSuJ5XDzC3ALjZIUC4YIWYKaa07AYITVASC6hGdqK9hkJhv6y3TJ+q2X2xir7sNW3aEW7REvwLMB54oYrvYMBPaDw4qzbadIT2EtrnWVyb6DjtTPrombJ0/nZpK4RDNvnj1xfZIpm0T1Ve1SyNSfIDGtdVCediNZpXu//LdJjCrX+vGxb00092T+iL29X8UD2hbYUorfqT4QNGMjYUb8fhrBMSTcq9FnGycxeaWpkR5WrYIvnpclRIxB5yzOunasaNhX9csTKXr/K2JcObz5xc6AzUzhfKxJJJ3kyaIDLoHma2Uimo00SEuFjF90X0thj57NPwcK7GMZ8FUCrDMbbHtyJ5yG80OIfUVZLPqNlbW8ePuIrOIaZ53EaVRdh5YWFlu4FeporHZd6MAjwRIaX8KZhYUfuKQSVWMlHbdpEZ79JksswbT38qlTkuA3WSvfrBfcWvDVWiShvK+aAbHaX1766uVD1dCtSAvheFkIusXC4/luoG0L4PSzpk0x+6c02kEjCI+b0j2b0pnDHlru0nMfFpeuzt7ezJYb20uYQ9O+aKWjqwb7w+OnS/RR7R5IEFMGLzAskxZqd1nUlsbjoj0HECBmdYfqYeJ35G0dy4NfsqiutIC+Xm7AnOP9oNy2N/G6Rw0SFMNH503WHDkvIgIymixlCJyYXOvOInT/Kr6yJ5sosOAQo5hZ0gNI2xNX13mBAvFOq7O8YboN9v/eOn1EYPiiVKxy05wncfYhjXJsS90r7uxD0X0j26OeSav0z89y258Og8/fjE9rZmJVRm8IrtDJozCZvJL6ayGlUgVBlk=";
  var $ = function (id) { return document.getElementById(id); };
  var till = new URLSearchParams(location.search).get("till");
  if (till && !/^\/[^/\\]/.test(till)) till = null;

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  function visa(projekt) {
    $("antal").textContent = projekt.length + " projekt";
    $("lista").innerHTML = projekt.map(function (p) {
      var ext = /^https:\/\//.test(p.sida);
      return '<li><a href="' + (ext ? esc(p.sida) + '" target="_blank" rel="noopener' : '/' + esc(p.sida)) + '"><div class="meta"><span>' + esc(p.kategori) + '</span><span>' + esc(p.datum) + '</span></div>' +
        '<h2>' + esc(p.titel) + '</h2><p>' + esc(p.beskrivning) + '</p></a></li>';
    }).join("");
    $("inlogg").hidden = true; $("vy").hidden = false;
  }

  async function prova(nyckel) {
    return JSON.parse(await Las.dekryptera(nyckel, LISTA));
  }

  (async function start() {
    try {
      var n = await Las.sparadNyckel();
      if (n) {
        var p = await prova(n);
        if (till) return location.replace(till);
        return visa(p);
      }
    } catch (e) { Las.glom(); }
    $("inlogg").hidden = false; $("losen").focus();
  })();

  $("inlogg").addEventListener("submit", async function (ev) {
    ev.preventDefault();
    $("knapp").disabled = true; $("fel").textContent = "";
    try {
      var n = await Las.harled($("losen").value);
      var p = await prova(n);
      await Las.spara(n, $("kom").checked);
      $("losen").value = "";
      if (till) return location.replace(till);
      visa(p);
    } catch (e) {
      $("fel").textContent = "Fel lösenord.";
      $("losen").select();
    } finally { $("knapp").disabled = false; }
  });

  $("ut").addEventListener("click", function () {
    Las.glom(); $("vy").hidden = true; $("inlogg").hidden = false; $("losen").focus();
  });
})();
</script>
</body>
</html>
