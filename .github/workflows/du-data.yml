name: Hämta data för D&U plattformen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - du-plattformen/data/hamta.py
      - .github/workflows/du-data.yml

permissions:
  contents: write

jobs:
  hamta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Hämta OpenStreetMap och Kungälvs öppna data
        run: python3 du-plattformen/data/hamta.py
      - name: Spara ögonblicksbilden i repot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add du-plattformen/data/*.json
          git diff --cached --quiet || git commit -m "D&U plattformen: uppdaterad data för Kungälv"
          git pull --rebase origin main
          git push origin HEAD:main
